name: Painel de agenda (tablets)

# Lê a agenda do dia no InBarber e publica CRIPTOGRAFADA no branch `painel-dados`,
# que a página braxbarbearia.com.br/painel/ lê. Repositório público = minutos grátis.
# O log não mostra nome de cliente.

on:
  schedule:
    # A cada 10 min, das 07:00 às 20:50 BRT (10:00-23:50 UTC).
    # O GitHub pode atrasar alguns minutos nos horários de pico.
    - cron: "*/10 10-23 * * *"
  workflow_dispatch: {}

concurrency:
  group: painel-agenda
  cancel-in-progress: true

permissions:
  contents: write   # só para gravar o branch painel-dados

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INBARBER_EMAIL: ${{ secrets.INBARBER_EMAIL }}
      INBARBER_PASSWORD: ${{ secrets.INBARBER_PASSWORD }}
      PAINEL_KEY: ${{ secrets.PAINEL_KEY }}
      TZ: America/Sao_Paulo
      HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: painel-robo/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r painel-robo/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ler agenda e criptografar
        working-directory: painel-robo
        run: python painel_agenda.py

      - name: Publicar no branch painel-dados
        if: hashFiles('painel-robo/saida/agenda.json') != ''
        run: |
          mkdir -p /tmp/pub && cp painel-robo/saida/agenda.json /tmp/pub/agenda.json
          cd /tmp/pub
          git init -q -b painel-dados
          git config user.name "brax-painel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agenda.json
          git commit -q -m "agenda $(date +%d/%m\ %H:%M)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" painel-dados
