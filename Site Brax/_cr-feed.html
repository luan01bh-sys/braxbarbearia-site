<style>
  :root{
    --bg:#0a0a0b;
    --ink:#08080a;
    --gold:#c9a24b;
    --gold-bright:#e6c675;
    --ivory:#f3efe4;
    --muted:#a49f93;
    --line:rgba(201,162,75,0.38);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#151515; }
  body{ display:flex; flex-direction:column; align-items:flex-start; }
  /* hide any host-injected badge (e.g. Netlify) from screenshots */
  #netlify-badge, .netlify-badge, [id*="netlify" i], [class*="netlify" i],
  #nl-badge-frame, iframe[title="Powered by Netlify"],
  ins, .badge-powered, a[href*="netlify.com"]{ display:none !important; }

  .frame{
    position:relative;
    width:1080px;
    height:1350px;
    background:var(--bg);
    overflow:hidden;
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--ivory);
    isolation:isolate;
  }
  .frame.story{ height:1920px; }
