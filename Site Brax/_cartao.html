<title>Brax Cartao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0b0b0c; --gold:#c9a24b; --gold-bright:#e6c675; --ivory:#f3efe4; --muted:#9c968a;
    --line:rgba(201,162,75,0.40);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#151515; }
  body{ display:block; padding:30px; }

  /* 96 x 56 mm @ 300dpi = 1134 x 661 px  (cartão 90x50mm + 3mm de sangria) */
  .card{
    position:relative; width:1134px; min-width:1134px; height:661px; min-height:661px; flex-shrink:0;
    overflow:hidden; margin-bottom:30px;
    background:
      radial-gradient(70% 90% at 50% 12%, rgba(201,162,75,0.15), transparent 62%),
      var(--bg);
    font-family:'Manrope', sans-serif; color:var(--ivory);
  }
  /* borda gravada — bem dentro da área segura */
  .brd{ position:absolute; inset:70px; border:1px solid var(--line); pointer-events:none; }
  .brd::before,.brd::after{ content:""; position:absolute; width:26px; height:26px; border:2px solid var(--gold-bright); }
  .brd::before{ top:-2px; left:-2px; border-right:0; border-bottom:0; }
  .brd::after{ bottom:-2px; right:-2px; border-left:0; border-top:0; }

  .mono{ font-family:'Space Mono', monospace; }

  /* ---------- FRENTE ---------- */
  .front{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:80px; }
  .front > .fx{ display:flex; flex-direction:column; align-items:center; }
  .front .star{ color:var(--gold); margin-bottom:34px; }
  .front .star svg{ width:26px; height:26px; }
  .front .name{ font-family:'Cormorant SC', serif; font-weight:700; font-size:118px; line-height:1; letter-spacing:0.16em; text-indent:0.16em; color:var(--ivory); }
  .front .sub{
    margin-top:20px; display:flex; align-items:center; gap:18px;
    font-family:'Space Mono', monospace; font-size:22px; letter-spacing:0.42em; text-indent:0.42em; color:var(--gold);
  }
  .front .sub i{ display:block; width:44px; height:1px; background:var(--gold); opacity:.6; }
  .front .tag{ margin-top:40px; font-size:19px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }

  /* ---------- VERSO ---------- */
  .back{ position:absolute; inset:0; display:grid; grid-template-columns:auto 1fr; align-items:center; gap:64px; padding:80px 104px; }
  .qr-wrap{ flex-shrink:0; background:#fff; padding:20px; border-radius:8px; }
  .qr-wrap #qr img, .qr-wrap #qr canvas{ display:block; width:280px; height:280px; }
  .back .info{ flex:1; display:flex; flex-direction:column; }
  .back .bmark{ font-family:'Cormorant SC', serif; font-weight:700; font-size:40px; letter-spacing:0.18em; text-indent:0.18em; color:var(--ivory); }
  .back .cta{ margin-top:8px; font-family:'Space Mono', monospace; font-size:20px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); }
  .back .url{ margin-top:28px; font-family:'Space Mono', monospace; font-weight:700; font-size:30px; color:var(--gold-bright); }
  .back .rule{ width:120px; height:1px; background:var(--line); margin:26px 0; }
  .back .row{ display:flex; align-items:center; gap:14px; font-size:22px; color:var(--ivory); margin-bottom:12px; }
  .back .row svg{ width:22px; height:22px; flex-shrink:0; color:var(--gold); }
  .back .addr{ margin-top:16px; font-size:21px; line-height:1.6; color:var(--muted); }
  .back .addr b{ color:var(--ivory); font-weight:600; }
</style>

<!-- ===================== FRENTE ===================== -->
<div class="card front" id="front">
  <div class="brd"></div>
  <div class="fx">
    <div class="star"><svg viewBox="0 0 18 18" fill="none"><path d="M9 0L11 7L18 9L11 11L9 18L7 11L0 9L7 7L9 0Z" fill="currentColor"/></svg></div>
    <div class="name">BRAX</div>
    <div class="sub"><i></i>BARBEARIA<i></i></div>
    <div class="tag">Precisão que se vê de longe</div>
  </div>
</div>

<!-- ===================== VERSO ===================== -->
<div class="card back" id="back">
  <div class="brd"></div>
  <div class="qr-wrap"><div id="qr"></div></div>
  <div class="info">
    <div class="bmark">BRAX</div>
    <div class="cta">Agende pelo site</div>
    <div class="url">braxbarbearia.com.br</div>
    <div class="rule"></div>
    <div class="row">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.52 14c-.25.7-1.45 1.36-2 1.41-.53.05-1.02.24-3.42-.71-2.9-1.15-4.73-4.1-4.88-4.29-.14-.19-1.16-1.55-1.16-2.96s.74-2.1 1-2.39c.26-.29.57-.36.76-.36l.55.01c.18.01.42-.07.65.5.25.6.85 2.08.92 2.23.07.15.12.32.02.51-.1.19-.15.31-.29.48l-.44.51c-.14.14-.29.3-.13.58.17.29.74 1.22 1.59 1.98 1.09.97 2.01 1.27 2.29 1.42.29.14.45.12.62-.07.17-.19.72-.83.91-1.12.19-.29.38-.24.64-.14.26.09 1.66.78 1.94.93.29.14.48.21.55.33.07.11.07.65-.18 1.35z"/></svg>
      WhatsApp (31) 99291-6354
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2"/></svg>
      @braxbarbearia
    </div>
    <div class="addr"><b>R. Clélia, 151 — Rio Branco</b><br>Belo Horizonte / MG</div>
  </div>
</div>

<script>
  new QRCode(document.getElementById("qr"), {
    text: "https://braxbarbearia.com.br",
    width: 280, height: 280,
    colorDark: "#0b0b0c", colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
</script>
