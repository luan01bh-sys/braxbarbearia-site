<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0b">
<title>Agenda — Brax</title>
<link rel="icon" href="../assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Manrope:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0a0b; --surface:#141317; --surface-2:#1b1a1f; --line:rgba(201,162,75,.18); --soft:rgba(255,255,255,.07);
    --gold:#c9a24b; --gold-2:#e6c675; --ivory:#f3efe4; --muted:#9a968c; --dim:#67645d; --ok:#63a877; --warn:#d98b3f; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body,#root{ height:100%; }
  body{ background:var(--bg); color:var(--ivory); font-family:'Manrope',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    overflow:hidden; user-select:none; }
  .mono{ font-family:'Space Mono',ui-monospace,monospace; }
  .app{ height:100%; display:flex; flex-direction:column; padding:20px 26px 16px; gap:16px; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand{ display:flex; align-items:center; gap:14px; min-width:0; }
  .brand img{ height:44px; width:auto; }
  .brand h1{ font-family:'Cormorant SC',serif; font-weight:700; font-size:30px; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .clock{ text-align:right; }
  .clock .h{ font-family:'Space Mono',monospace; font-size:34px; font-weight:700; line-height:1; color:var(--gold-2); }
  .clock .d{ font-size:13px; color:var(--muted); margin-top:4px; }
  .cols{ flex:1; min-height:0; display:grid; gap:18px; grid-template-columns:repeat(var(--n,1), minmax(0,1fr)); }
  .col{ display:flex; flex-direction:column; gap:12px; min-height:0; }
  .col h2{ font-family:'Cormorant SC',serif; font-size:24px; color:var(--gold-2); letter-spacing:.05em; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 20px; }
  .lbl{ font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  .agora .nome{ font-size:clamp(30px,4.6vw,54px); font-weight:800; line-height:1.08; margin-top:8px; }
  .prox .nome{ font-size:clamp(26px,3.6vw,42px); font-weight:800; line-height:1.1; margin-top:8px; }
  .meta{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:8px; font-size:17px; color:var(--muted); }
  .meta b{ color:var(--ivory); font-family:'Space Mono',monospace; font-weight:700; }
  .agora{ border-color:rgba(201,162,75,.55); background:linear-gradient(180deg, rgba(201,162,75,.13), rgba(201,162,75,.03)); }
  .livre .nome{ color:var(--muted); font-weight:700; }
  .tag{ display:inline-block; margin-left:8px; padding:3px 10px; border-radius:999px; font-family:'Space Mono',monospace; font-size:12px;
    letter-spacing:.06em; vertical-align:middle; border:1px solid; }
  .tag.em{ color:var(--gold-2); border-color:rgba(201,162,75,.5); }
  .tag.ag{ color:var(--warn); border-color:rgba(217,139,63,.5); }
  .lista{ flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; padding:10px 0 4px; }
  .lista .lbl{ padding:4px 20px 8px; }
  .row{ display:grid; grid-template-columns:72px 1fr; gap:12px; align-items:baseline; padding:9px 20px; border-top:1px solid var(--soft); }
  .row .t{ font-family:'Space Mono',monospace; font-size:18px; color:var(--gold-2); }
  .row .n{ font-size:19px; font-weight:700; }
  .row .s{ font-size:14px; color:var(--muted); font-weight:500; display:block; margin-top:1px; }
  .row.feito .t, .row.feito .n{ color:var(--dim); }
  .vazio{ color:var(--dim); font-size:16px; padding:10px 20px; }
  footer{ display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:12px; color:var(--dim); }
  footer .alerta{ color:var(--warn); }
  footer button{ background:0; border:1px solid var(--soft); color:var(--muted); border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  .tela{ height:100%; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .tela .box{ max-width:520px; }
  .tela h1{ font-family:'Cormorant SC',serif; font-size:32px; color:var(--gold-2); margin-bottom:10px; }
  .tela p{ color:var(--muted); line-height:1.6; }
  @media (max-width:700px){ .cols{ grid-template-columns:1fr; } body{ overflow:auto; } .app{ height:auto; min-height:100%; } .lista{ overflow:visible; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  "use strict";
  var DADOS_URL = "https://raw.githubusercontent.com/luan01bh-sys/braxbarbearia-site/painel-dados/agenda.json";
  var ATUALIZA_MS = 2 * 60 * 1000;     // busca dados novos a cada 2 min
  var DESENHA_MS = 20 * 1000;          // redesenha (relógio, agora/próximo) a cada 20 s
  var root = document.getElementById("root");

  // ---- parâmetros do link: #p=luan&k=CHAVE (o que vem depois do # não sai do aparelho) ----
  var hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  var chave = hash.get("k");
  var prof = (hash.get("p") || "").trim().toLowerCase();
  try{
    if(chave) localStorage.setItem("brax_painel_k", chave); else chave = localStorage.getItem("brax_painel_k");
    if(prof) localStorage.setItem("brax_painel_p", prof); else if(!hash.has("p")) prof = localStorage.getItem("brax_painel_p") || "";
  }catch(e){}

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function min(hhmm){ var p = String(hhmm||"0:0").split(":"); return (+p[0])*60 + (+p[1]); }
  function hoje(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function agoraMin(){ var d = new Date(); return d.getHours()*60 + d.getMinutes(); }
  function tela(titulo, texto){ root.innerHTML = '<div class="tela"><div class="box"><h1>'+esc(titulo)+'</h1><p>'+texto+'</p></div></div>'; }

  if(!chave){ tela("Link incompleto", "Abra o painel pelo link completo do seu tablet (ele termina com <b>#p=…&amp;k=…</b>)."); return; }
  if(!(window.crypto && crypto.subtle)){ tela("Navegador sem suporte", "Abra este link no Chrome atualizado."); return; }

  function b64(s){ var bin = atob(s); var u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }
  function b64url(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; return b64(s); }
  var chavePromise = crypto.subtle.importKey("raw", b64url(chave), "AES-GCM", false, ["decrypt"]);

  var dados = null, erro = null, ultimaBusca = 0;

  function buscar(){
    return fetch(DADOS_URL + "?t=" + Date.now(), { cache:"no-store" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(pkt){
        return chavePromise.then(function(k){
          return crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(pkt.iv) }, k, b64(pkt.ct));
        });
      })
      .then(function(buf){ dados = JSON.parse(new TextDecoder().decode(buf)); erro = null; ultimaBusca = Date.now(); })
      .catch(function(e){ erro = (e && e.name==="OperationError") ? "chave" : "rede"; console.warn("painel", e); })
      .then(desenhar);
  }

  // escolhe "agora", "próximo" e o restante do dia
  function situacao(lista){
    var t = agoraMin(), atual = null, proximo = null, resto = [], feitos = 0;
    lista.forEach(function(a){
      var ini = min(a.inicio), fim = min(a.fim);
      if(ini <= t && t < fim) atual = a;
    });
    lista.forEach(function(a){
      var ini = min(a.inicio), fim = min(a.fim);
      if(a === atual) return;
      if(fim <= t || (a.pago && ini <= t)){ feitos++; return; }
      if(ini > t || (!atual && fim > t)){
        if(!proximo) proximo = a; else resto.push(a);
      }
    });
    return { atual:atual, proximo:proximo, resto:resto, feitos:feitos };
  }

  function emQuanto(a){
    var d = min(a.inicio) - agoraMin();
    if(d <= 0) return '<span class="tag ag">já deveria ter começado</span>';
    if(d < 60) return '<span class="tag em">em '+d+' min</span>';
    return '<span class="tag em">em '+Math.floor(d/60)+'h'+(d%60?String(d%60).padStart(2,"0"):"")+'</span>';
  }

  function colunaHtml(nome, lista, mostrarNome){
    var s = situacao(lista);
    var h = '<section class="col">';
    if(mostrarNome) h += '<h2>'+esc(nome)+'</h2>';
    if(s.atual){
      h += '<div class="card agora"><div class="lbl">Agora</div><div class="nome">'+esc(s.atual.cliente)+'</div>'+
        '<div class="meta"><span><b>'+esc(s.atual.inicio)+'–'+esc(s.atual.fim)+'</b></span><span>'+esc(s.atual.servico)+'</span></div></div>';
    } else {
      h += '<div class="card agora livre"><div class="lbl">Agora</div><div class="nome">Livre</div>'+
        '<div class="meta"><span>'+(lista.length ? "Nenhum atendimento neste horário" : "Nenhum agendamento hoje")+'</span></div></div>';
    }
    if(s.proximo){
      h += '<div class="card prox"><div class="lbl">Próximo '+emQuanto(s.proximo)+'</div><div class="nome">'+esc(s.proximo.cliente)+'</div>'+
        '<div class="meta"><span><b>'+esc(s.proximo.inicio)+'</b></span><span>'+esc(s.proximo.servico)+'</span></div></div>';
    }
    h += '<div class="card lista"><div class="lbl">Depois '+(s.feitos ? '<span style="color:var(--dim);letter-spacing:.06em;text-transform:none"> · '+s.feitos+' já atendido(s) hoje</span>' : '')+'</div>';
    if(!s.resto.length){
      h += '<div class="vazio">'+(s.proximo ? "Depois do próximo, agenda livre." : "Sem mais agendamentos hoje.")+'</div>';
    } else {
      h += s.resto.map(function(a){
        return '<div class="row"><span class="t">'+esc(a.inicio)+'</span><span class="n">'+esc(a.cliente)+'<span class="s">'+esc(a.servico)+'</span></span></div>';
      }).join("");
    }
    h += '</div></section>';
    return h;
  }

  function desenhar(){
    var d = new Date();
    var relogio = '<div class="clock"><div class="h">'+String(d.getHours()).padStart(2,"0")+':'+String(d.getMinutes()).padStart(2,"0")+'</div>'+
      '<div class="d">'+(function(t){ return t.charAt(0).toUpperCase()+t.slice(1); })(d.toLocaleDateString("pt-BR",{ weekday:"long", day:"2-digit", month:"long" }))+'</div></div>';

    if(!dados){
      if(erro==="chave") tela("Chave inválida", "O link deste tablet não confere com a chave do painel. Peça o link novo ao Luan.");
      else tela("Carregando a agenda…", erro ? "Sem conexão agora. Tentando de novo em instantes." : "");
      return;
    }

    var profs = dados.profissionais || {};
    var nomes = Object.keys(profs);
    if(prof){
      var achou = nomes.filter(function(n){ return n.toLowerCase() === prof; });
      nomes = achou.length ? achou : [];
    }
    var titulo = prof && nomes.length===1 ? "Agenda · "+nomes[0] : "Agenda Brax";
    var diaErrado = dados.data !== hoje();

    var corpo;
    if(prof && !nomes.length){
      corpo = '<div class="tela"><div class="box"><h1>Profissional não encontrado</h1><p>Confira o "p=" do link.</p></div></div>';
    } else if(diaErrado){
      corpo = '<div class="tela"><div class="box"><h1>Agenda de hoje ainda não carregou</h1><p>Ela aparece sozinha assim que o robô ler o InBarber (a partir das 7h).</p></div></div>';
    } else {
      corpo = '<div class="cols" style="--n:'+nomes.length+'">'+nomes.map(function(n){ return colunaHtml(n, profs[n]||[], !prof || nomes.length>1); }).join("")+'</div>';
    }

    var atualizado = dados.atualizado ? new Date(dados.atualizado) : null;
    var idadeMin = atualizado ? Math.round((Date.now() - atualizado.getTime())/60000) : null;
    var rodape = atualizado
      ? 'Agenda lida do InBarber às '+String(atualizado.getHours()).padStart(2,"0")+':'+String(atualizado.getMinutes()).padStart(2,"0")+
        (idadeMin > 30 ? ' <span class="alerta">· desatualizada há '+idadeMin+' min</span>' : '')
      : '';
    if(erro) rodape += ' <span class="alerta">· sem conexão</span>';

    root.innerHTML = '<div class="app"><header><div class="brand"><img src="../assets/logo.png" alt="Brax"><h1>'+esc(titulo)+'</h1></div>'+relogio+'</header>'+
      corpo+'<footer><span>'+rodape+'</span><button id="tela-cheia">tela cheia</button></footer></div>';
    var bt = document.getElementById("tela-cheia");
    if(bt) bt.onclick = function(){ var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); pedirTelaAcesa(); };
  }

  // mantém a tela acesa (Chrome/Android)
  var trava = null;
  function pedirTelaAcesa(){
    if(!("wakeLock" in navigator) || trava) return;
    navigator.wakeLock.request("screen").then(function(t){ trava = t; t.addEventListener("release", function(){ trava = null; }); }).catch(function(){});
  }
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible"){ pedirTelaAcesa(); buscar(); } });
  document.addEventListener("click", pedirTelaAcesa);

  buscar(); pedirTelaAcesa();
  setInterval(buscar, ATUALIZA_MS);
  setInterval(desenhar, DESENHA_MS);
})();
</script>
</body>
</html>
